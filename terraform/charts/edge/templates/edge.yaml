apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: lgtm-proxy
  namespace: {{ .Values.gatewayNamespace }}
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 1
      envoyService:
        # Fixed name so Terraform can read the NLB hostname.
        name: {{ .Values.nlbServiceName }}
        type: LoadBalancer
        # With externalTrafficPolicy Local the client IP is preserved and the in-tree AWS
        # cloud provider applies loadBalancerSourceRanges to the node security group.
        externalTrafficPolicy: Local
        loadBalancerSourceRanges:
          - {{ .Values.allowedCidr | quote }}
        annotations:
          service.beta.kubernetes.io/aws-load-balancer-type: nlb
          service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: lgtm-proxy
    namespace: {{ .Values.gatewayNamespace }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: lgtm
  namespace: {{ .Values.gatewayNamespace }}
spec:
  gatewayClassName: eg
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: lgtm-server-tls
      # Routes live next to their backends (lgtm, astronomy-shop); only those namespaces may attach.
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: {{ toJson .Values.routeNamespaces }}
---
# TLS chain: SelfSigned issuer -> CA certificate (isCA) -> CA ClusterIssuer -> server certificate.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: lgtm-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lgtm-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: lgtm-demo-ca
  secretName: lgtm-ca-key-pair
  duration: 8760h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    kind: ClusterIssuer
    name: lgtm-selfsigned
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: lgtm-ca
spec:
  ca:
    secretName: lgtm-ca-key-pair
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lgtm-server
  namespace: {{ .Values.gatewayNamespace }}
spec:
  secretName: lgtm-server-tls
  duration: 2160h
  commonName: lgtm-demo
  # The NLB hostname does not exist before the Gateway does, so the SAN is the wildcard that
  # covers any NLB hostname in the region (<name>-<hash>.elb.<region>.amazonaws.com).
  dnsNames:
    - {{ printf "*.elb.%s.amazonaws.com" .Values.region | quote }}
    - localhost
  issuerRef:
    kind: ClusterIssuer
    name: lgtm-ca
